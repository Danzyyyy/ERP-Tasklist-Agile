      responses:
        '200':
          description: Identitas akun berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    "$ref": "#/components/schemas/UserIdentity"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
  "/identitas/akun/{accountId}":
    get:
      tags:
      - External - Modul F-1 (Identity & Auth)
      summary: Alias Bahasa Indonesia untuk /identity/accounts/{accountId}
      description: Endpoint alias sesuai dokumen kesepakatan integrasi untuk mengambil
        data identitas akun dari Modul F-1.
      operationId: getAccountIdentityId
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Identitas akun berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    "$ref": "#/components/schemas/UserIdentity"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
  "/accounts/{accountId}/role":
    get:
      tags:
      - External - Modul F-1 (Identity & Auth)
      summary: Ambil peran akun via Modul F-1 (GET /accounts/{accountId}/role)
      description: Memeriksa kode peran (roleCode) dan status keaktifan akun dari
        Modul F-1.
      operationId: getAccountRole
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: '01929b4a-6e2a-7b3f-8c71-0ab4e3d9f2a1'
      responses:
        '200':
          description: Peran akun berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    "$ref": "#/components/schemas/AccountRole"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
  "/akun/{accountId}/peran":
    get:
      tags:
      - External - Modul F-1 (Identity & Auth)
      summary: Alias Bahasa Indonesia untuk /accounts/{accountId}/role
      description: Endpoint alias sesuai dokumen kesepakatan integrasi untuk memeriksa
        peran akun dari Modul F-1.
      operationId: getAccountRoleId
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Peran akun berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    "$ref": "#/components/schemas/AccountRole"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
  "/projects/{projectId}":
    get:
      tags:
      - External - Modul D-1 (Project Intake)
      summary: Ambil informasi proyek kanonis dari Modul D-1 (GET /projects/{projectId})
      description: Mengambil data proyek resmi dari sistem Intake D-1 untuk memverifikasi
        detail klien, PM, dan status registrasi.
      operationId: getProjectIntakeDetails
      parameters:
      - name: projectId
        in: path
        required: true
        description: UUID v7 atau kode proyek
        schema:
          type: string
          example: '01929b4a-5f10-7a22-9d44-3c8f1b2e7a90'
      responses:
        '200':
          description: Data proyek berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  projectId:
                    type: string
                    example: '01929b4a-5f10-7a22-9d44-3c8f1b2e7a90'
                  data:
                    "$ref": "#/components/schemas/ProjectIntakeResponse"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
  "/projects/{projectId}/guard":
    get:
      tags:
      - External - Modul D-1 (Project Intake)
      summary: Periksa guard kelayakan proyek (Wajib status REGISTERED)
      description: Memastikan bahwa proyek telah disahkan dengan status REGISTERED
        di sistem intake D-1 sebelum modul/tugas eksekusi Agile dapat diproses.
      operationId: checkProjectGuard
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          example: PROJ-ERP-01
      responses:
        '200':
          description: Proyek terverifikasi dan memenuhi syarat (status REGISTERED).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectGuardResponse"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '422':
          description: Proyek tidak berstatus REGISTERED atau belum terdaftar di D-1.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectGuardResponse"
  "/projects/{projectId}/execution-readiness":
    get:
      tags:
      - External - Modul E-3 (Execution Readiness)
      summary: Ambil status kesiapan eksekusi proyek dari Modul E-3 (Prioritas Utama
        P6)
      description: Mengambil status kesiapan eksekusi proyek dari Modul E-3 berdasarkan
        penyelesaian Kickoff Meeting dan MoM. Hasil mencakup flag readyForExecution.
      operationId: getProjectExecutionReadiness
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          example: PROJ-ERP-01
      responses:
        '200':
          description: Status kesiapan eksekusi proyek berhasil diambil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  projectId:
                    type: string
                    example: PROJ-ERP-01
                  data:
                    "$ref": "#/components/schemas/ExecutionReadinessResponse"
        '401':
          "$ref": "#/components/responses/UnauthorizedError"
        '404':
          "$ref": "#/components/responses/NotFoundError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Masukkan Bearer Token JWT sesuai kontrak Modul F-1 atau gunakan
        token simulasi (`mock_tl`, `mock_pm`, `mock_dev`, `mock_tester`).

'
  parameters:
    ModuleIdParam:
      name: moduleId
      in: path
      required: true
      description: UUID v7 dari Modul
      schema:
        type: string
        format: uuid
        example: 01a15be6-5631-718d-a765-08ec530e5cb6
    TaskIdPathParam:
      name: id
      in: path
      required: true
      description: UUID v7 dari Tugas (Task)
      schema:
        type: string
        format: uuid
        example: 01a15be6-5638-72a3-a9b8-61a5e3da72de
    TaskIdNamedParam:
      name: taskId
      in: path
      required: true
      description: UUID v7 dari Tugas (Task)
      schema:
        type: string
        format: uuid
        example: 01a15be6-5638-72a3-a9b8-61a5e3da72de
  responses:
    UnauthorizedError:
      description: Tidak terotentikasi — Header Authorization Bearer token tidak ada
        atau tidak valid.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UnauthorizedErrorResponse"
          example:
            status: error
            message: 'Unauthenticated: Bearer token is missing or invalid.'
    NotFoundError:
      description: Entitas atau sumber daya yang diminta tidak ditemukan.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: No query results for model [App\Models\Task] 01a15be6-0000-7000-8000-000000000000
    ValidationError:
      description: Kesalahan validasi input (Unprocessable Content).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ValidationErrorResponse"
  schemas:
    UserRoleEnum:
      type: string
      enum:
      - TECHNICAL_LEAD
      - PROJECT_MANAGER
      - DEVELOPER
      - TESTER
      example: TECHNICAL_LEAD
    ComplexityWeightEnum:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      example: HIGH
    TaskStatusEnum:
      type: string
      enum:
      - DRAFT
      - RELEASED
      - DEVELOPMENT
      - CODE_REVIEW
      - TESTING
      - DONE
      example: DEVELOPMENT
    ApprovalStatusEnum:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      example: APPROVED
    ReviewTypeEnum:
      type: string
      enum:
      - CODE_REVIEW
      - TESTING
      - QA_TESTING
      description: Nilai `QA_TESTING` diterima pada input dan dinormalisasi menjadi
        `TESTING`.
      example: TESTING
    ReviewResultEnum:
      type: string
      enum:
      - PASSED
      - REJECTED
      example: REJECTED
    DependencyTypeEnum:
      type: string
      enum:
      - HARD_BLOCK
      - WARNING
      example: HARD_BLOCK
    DemoToken:
      type: object
      properties:
        role:
          "$ref": "#/components/schemas/UserRoleEnum"
        name:
          type: string
          example: Fauzan (Technical Lead)
        email:
          type: string
          format: email
          example: tl@anaheim.id
        token:
          type: string
          example: mock_tl
        description:
          type: string
          example: Memiliki hak Dual-Approval Task Release dan Sign-off Final DONE.
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: '01926df4-0001-7000-8000-000000000001'
        name:
          type: string
          example: Fauzan (Technical Lead)
        email:
          type: string
          format: email
          example: tl@anaheim.id
        role:
          "$ref": "#/components/schemas/UserRoleEnum"
    Module:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01a15be6-5631-718d-a765-08ec530e5cb6
        project_id:
          type: string
          example: PROJ-ERP-01
        code:
          type: string
          example: MOD-E4
        name:
          type: string
          example: Tasklist dan Eksekusi Agile
        description:
          type: string
          nullable: true
          example: Modul pengelolaan hierarki tugas dan eksekusi Agile Kanban
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Feature:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01a15be6-5634-72a3-a9b8-61a5e3da72de
        module_id:
          type: string
          format: uuid
          example: 01a15be6-5631-718d-a765-08ec530e5cb6
        code:
          type: string
          example: FTR-K04-03
        name:
          type: string
          example: Dual-Approval Task Release Gate
        description:
          type: string
          nullable: true
          example: Mekanisme persetujuan ganda oleh TL dan PM sebelum tugas dirilis
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModuleWithFeatures:
      allOf:
      - "$ref": "#/components/schemas/Module"
      - type: object
        properties:
          features:
            type: array
            items:
              "$ref": "#/components/schemas/Feature"
    ModuleHierarchyNode:
      allOf:
      - "$ref": "#/components/schemas/Module"
      - type: object
        properties:
          features:
            type: array
            items:
              allOf:
              - "$ref": "#/components/schemas/Feature"
              - type: object
                properties:
                  tasks:
                    type: array
                    items:
                      "$ref": "#/components/schemas/TaskWithApprovals"
          tasks:
            type: array
            description: Tugas-tugas yang berinduk langsung pada modul tanpa fitur
              (`feature_id = null`)
            items:
              "$ref": "#/components/schemas/TaskWithApprovals"
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01a15be6-5638-72a3-a9b8-61a5e3da72de
        module_id:
          type: string
          format: uuid
          example: 01a15be6-5631-718d-a765-08ec530e5cb6
        feature_id:
          type: string
          format: uuid
          nullable: true
          example: 01a15be6-5634-72a3-a9b8-61a5e3da72de
        task_code:
          type: string
          example: TSK-099
        title:
          type: string
          example: Implementasi endpoint rekap invoice
        description:
          type: string
          nullable: true
          example: Integrasi perhitungan PPN 12% dan diskon volume
        complexity_weight:
          "$ref": "#/components/schemas/ComplexityWeightEnum"
        estimated_man_hours:
          type: number
          format: float
          example: 14.5
        actual_man_hours:
          type: number
          format: float
          example: 0
        target_deadline:
          type: string
          format: date-time
          example: '2026-11-15T17:00:00Z'
        status:
          "$ref": "#/components/schemas/TaskStatusEnum"
        is_pm_verified:
          type: boolean
          example: false
        pm_verified_at:
          type: string
          format: date-time
          nullable: true
          example: 
        pm_verified_by:
          type: string
          nullable: true
          example: 
        is_tl_signed:
          type: boolean
          example: false
        tl_signed_at:
          type: string
          format: date-time
          nullable: true
          example: 
        tl_signed_by:
          type: string
          nullable: true
          example: 
        assignee_id:
          type: string
          nullable: true
          example: '01926df4-0003-7000-8000-000000000003'
        assignee_name:
          type: string
          nullable: true
          example: Ariel (Frontend Dev)
        created_by:
          type: string
          nullable: true
          example: '01926df4-0001-7000-8000-000000000001'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskApproval:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01a15be6-5640-7111-9000-111111111111
        task_id:
          type: string
          format: uuid
          example: 01a15be6-5638-72a3-a9b8-61a5e3da72de
        role:
          type: string
          enum:
          - TECHNICAL_LEAD
          - PROJECT_MANAGER
          example: TECHNICAL_LEAD
        status:
          "$ref": "#/components/schemas/ApprovalStatusEnum"
        approver_id:
          type: string
          nullable: true
          example: '01926df4-0001-7000-8000-000000000001'
        approver_name:
          type: string
          nullable: true
          example: Fauzan (Technical Lead)
        notes:
          type: string
          nullable: true
          example: Estimasi waktu dan arsitektur telah diverifikasi sesuai SLA SOP-07.
        actioned_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskReviewLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 01a15be6-5650-7222-9000-222222222222
        task_id:
          type: string
          format: uuid
          example: 01a15be6-5638-72a3-a9b8-61a5e3da72de
        review_type:
          type: string
          enum:
          - CODE_REVIEW
          - TESTING
          example: TESTING
        result:
          "$ref": "#/components/schemas/ReviewResultEnum"
        reviewer_id:
          type: string
          example: '01926df4-0004-7000-8000-000000000004'
        reviewer_name:
          type: string
          example: Valdric (QA Tester)
        notes:
          type: string
          nullable: true
          example: 'Bug ditemukan: nilai total diskon bernilai negatif saat kupon
            kadaluarsa.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskDependency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        prerequisite_task_id:
          type: string
          format: uuid
        dependency_type:
          "$ref": "#/components/schemas/DependencyTypeEnum"
        prerequisite_task:
          "$ref": "#/components/schemas/Task"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskWithApprovals:
      allOf:
      - "$ref": "#/components/schemas/Task"
      - type: object
        properties:
          approvals:
            type: array
            items:
              "$ref": "#/components/schemas/TaskApproval"
    TaskDetail:
      allOf:
      - "$ref": "#/components/schemas/Task"
      - type: object
        properties:
          module:
            "$ref": "#/components/schemas/Module"
          feature:
            allOf:
            - "$ref": "#/components/schemas/Feature"
            nullable: true
          approvals:
            type: array
            items:
              "$ref": "#/components/schemas/TaskApproval"
          review_logs:
            type: array
            items:
              "$ref": "#/components/schemas/TaskReviewLog"
          dependencies:
            type: array
            items:
              "$ref": "#/components/schemas/TaskDependency"
    DeliverableProgressMetrics:
      type: object
      properties:
        totalTasks:
          type: integer
          example: 8
        completedTasks:
          type: integer
          example: 3
        totalEstimatedManHours:
          type: number
          format: float
          example: 78.5
        completedManHours:
          type: number
          format: float
          example: 32.0
        actualManHoursSpent:
          type: number
          format: float
          example: 28.5
        progressPercentage:
          type: number
          format: float
          description: Rasio (completedManHours / totalEstimatedManHours) * 100%,
            bernilai 0.0 jika belum ada tugas.
          example: 40.76
        tasksAtRiskOrOverdue:
          type: integer
          description: Jumlah tugas belum DONE yang telah melewati tenggat H-1 (`target_deadline`).
          example: 1
        calculatedAt:
          type: string
          format: date-time
          example: '2026-10-21T07:50:00+00:00'
    CreateModuleRequest:
      type: object
      required:
      - project_id
      - code
      - name
      properties:
        project_id:
          type: string
          example: PROJ-ERP-01
        code:
          type: string
          description: Kode unik modul
          example: MOD-INV
        name:
          type: string
          example: Inventory & Asset Management
        description:
          type: string
          nullable: true
          example: Pengelolaan stok barang dan inventaris gudang
    CreateFeatureRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          description: Kode unik fitur
          example: FTR-INV-01
        name:
          type: string
          example: Barcode Scanning
        description:
          type: string
          nullable: true
          example: Pemindaian barcode barang masuk
    CreateTaskRequest:
      type: object
      required:
      - module_id
      - task_code
      - title
      - complexity_weight
      - estimated_man_hours
      - target_deadline
      properties:
        module_id:
          type: string
          format: uuid
          example: 01a15be6-5631-718d-a765-08ec530e5cb6
        feature_id:
          type: string
          format: uuid
          nullable: true
          description: Opsional sesuai Q-13 (SOP-05)
          example: 01a15be6-5634-72a3-a9b8-61a5e3da72de
        task_code:
          type: string
          maxLength: 50
          example: TSK-099
        title:
          type: string
          maxLength: 255
          example: Implementasi endpoint rekap invoice
        description:
          type: string
          nullable: true
          example: Integrasi perhitungan PPN 12% dan diskon volume
        complexity_weight:
          "$ref": "#/components/schemas/ComplexityWeightEnum"
        estimated_man_hours:
          type: number
          format: float
          minimum: 0.25
          description: Estimasi beban jam kerja riil (minimal 0.25 man-hour sesuai
            Q-02)
          example: 14.5
        actual_man_hours:
          type: number
          format: float
          minimum: 0
          nullable: true
          example: 0
        target_deadline:
          type: string
          format: date-time
          description: Tenggat waktu acuan H-1 deliverable dalam format ISO 8601 (Q-11)
          example: '2026-11-15T17:00:00Z'
    AssignTaskRequest:
      type: object
      required:
      - assignee_id
      - assignee_name
      properties:
        assignee_id:
          type: string
          example: '01926df4-0003-7000-8000-000000000003'
        assignee_name:
          type: string
          example: Ariel (Frontend Dev)
    UpdateTaskStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - RELEASED
          - DEVELOPMENT
          - CODE_REVIEW
          - TESTING
          - DONE
          example: DEVELOPMENT
        assignee_id:
          type: string
          nullable: true
          description: Wajib diisi apabila tugas belum memiliki assignee dan target
            status adalah DEVELOPMENT
          example: '01926df4-0003-7000-8000-000000000003'
        assignee_name:
          type: string
          nullable: true
          example: Ariel (Frontend Dev)
    SubmitApprovalRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - APPROVED
          - REJECTED
          description: Keputusan persetujuan rilis (`decision` juga didukung sebagai
            alias dari `status`)
          example: APPROVED
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          description: Alias opsional untuk field `status`
          example: APPROVED
        notes:
          type: string
          nullable: true
          example: Estimasi waktu dan arsitektur telah diverifikasi sesuai SLA SOP-07.
    SubmitReviewRequest:
      type: object
      required:
      - review_type
      - result
      properties:
        review_type:
          "$ref": "#/components/schemas/ReviewTypeEnum"
        result:
          "$ref": "#/components/schemas/ReviewResultEnum"
        notes:
          type: string
          nullable: true
          example: 'Bug ditemukan: nilai total diskon bernilai negatif saat kupon
            kadaluarsa.'
    UnauthorizedErrorResponse:
      type: object
      properties:
        status:
